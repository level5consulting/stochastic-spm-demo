<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Tributary Early Warning</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: application shell - slim left rail, top bar, working canvas of records and tables */
:root{
  --bg:#f5f6f4; --surface:#ffffff; --surface-2:#eef1ee; --line:#dde2dc; --fg:#1b2420; --muted:#5d6b64;
  --accent:#1f6b5c; --accent-soft:#e1efe9; --rail:#16302a; --rail-fg:#cfe0d9;
  --crit:#b3261e; --crit-soft:#fbe9e7; --warn:#a15c00; --warn-soft:#fdf0dc; --ok:#2e7d4f; --ok-soft:#e5f3ea;
  --hl:#fff2b3;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#18211e; --surface-2:#1f2a26; --line:#2c3833; --fg:#e4ebe7; --muted:#97a69f;
  --accent:#5fb8a2; --accent-soft:#1d3530; --rail:#0b1311; --rail-fg:#b5c7c0;
  --crit:#f2867d; --crit-soft:#3a1d1b; --warn:#e8a64a; --warn-soft:#382a16; --ok:#6cc58e; --ok-soft:#1b3326; --hl:#5a4d12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#18211e; --surface-2:#1f2a26; --line:#2c3833; --fg:#e4ebe7; --muted:#97a69f;
  --accent:#5fb8a2; --accent-soft:#1d3530; --rail:#0b1311; --rail-fg:#b5c7c0;
  --crit:#f2867d; --crit-soft:#3a1d1b; --warn:#e8a64a; --warn-soft:#382a16; --ok:#6cc58e; --ok-soft:#1b3326; --hl:#5a4d12; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px}
.app{display:grid;grid-template-columns:220px 1fr;height:100%}
.rail{background:var(--rail);color:var(--rail-fg);display:flex;flex-direction:column;gap:4px;padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:#fff;padding:0 8px 18px}
.brand svg{flex:none}
.rail button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;font-size:13.5px}
.rail button:hover{background:rgba(255,255,255,.07)}
.rail button.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.rail button:focus-visible{outline:2px solid var(--accent)}
.rail .count{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:rgba(255,255,255,.14);padding:1px 7px;border-radius:10px}
.rail .foot{margin-top:auto;font-size:11.5px;opacity:.7;padding:0 10px}
.main{display:flex;flex-direction:column;min-width:0;overflow:auto}
.top{display:flex;align-items:center;gap:14px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));position:sticky;top:0;z-index:5}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:6px;padding:7px 10px;color:var(--muted)}
.search input{all:unset;flex:1;color:var(--fg);font-size:13px}
.user{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
.user small{display:block;color:var(--muted);font-size:11.5px}
.page{padding-block:22px 40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font-size:21px;margin:0;font-weight:600;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.crumbs{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.crumbs a{color:var(--accent);cursor:pointer;text-decoration:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;font-weight:600}
.kpi span{font-size:12px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{font-size:14.5px;margin:0;font-weight:600}
.chip{font-size:11.5px;padding:3px 9px;border-radius:12px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);cursor:pointer;font-family:inherit}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.score{display:inline-flex;align-items:center;gap:8px}
.bar{width:54px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap}
.p-crit{background:var(--crit-soft);color:var(--crit)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-neu{background:var(--surface-2);color:var(--muted)}
.up{color:var(--crit)} .down{color:var(--ok)}
.sig{color:var(--muted);font-size:12.5px;max-width:340px}
.src{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding:1px 6px;border-radius:4px;margin-right:6px}
.src.in{background:var(--accent-soft);color:var(--accent)} .src.out{background:var(--warn-soft);color:var(--warn)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-color:var(--accent);font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;padding:14px 16px;font-size:13px}
.facts dt{color:var(--muted)} .facts dd{margin:0}
.chart{padding:10px 12px 4px}
.chart svg{width:100%;height:auto;display:block}
.marker{cursor:pointer}
.marker:focus-visible circle{stroke:var(--fg);stroke-width:3}
.ev{padding:16px;display:flex;flex-direction:column;gap:14px}
.ev h3{margin:0;font-size:14.5px}
.docs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.doc{border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:12px;font-size:12.5px;line-height:1.55;min-width:0}
.doc .meta{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-bottom:6px}
mark{background:var(--hl);color:inherit;padding:0 2px;border-radius:2px}
.lat{display:flex;flex-direction:column;gap:6px}
.lat div{display:grid;grid-template-columns:120px 1fr 60px;gap:10px;align-items:center;font-size:12.5px}
.lat i{display:block;height:10px;border-radius:3px;background:var(--muted);opacity:.45}
.lat i.hot{background:var(--crit);opacity:1}
.callout{border-left:3px solid var(--crit);background:var(--crit-soft);padding:10px 12px;border-radius:0 6px 6px 0;font-size:13px}
.btn{all:unset;cursor:pointer;background:var(--accent);color:#fff;padding:8px 14px;border-radius:6px;font-weight:600;font-size:13px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.alts td{cursor:default}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.demo-flag{font-size:11px;color:var(--muted)}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{flex-direction:row;overflow-x:auto;padding-block:8px;align-items:center}
  .brand{padding:0 8px 0 0} .rail .foot{display:none}
  .grid2,.docs{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .user small,.search{display:none}
  .page,.top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .25s ease}@keyframes fade{from{opacity:.4}to{opacity:1}}}
</style>

<div class="app">
  <nav class="rail" aria-label="Main">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4c5 3 5 8 8 10s6 2 8 6" stroke="#7fd1bd" stroke-width="2.2" stroke-linecap="round"/><path d="M10 3c1 4 4 6 6 7" stroke="#cfe0d9" stroke-width="2" stroke-linecap="round"/></svg>
      Tributary
    </div>
    <button class="on" data-nav="watch">Watch list <span class="count">20</span></button>
    <button data-nav="suppliers">Suppliers <span class="count">1,412</span></button>
    <button data-nav="reviews">Reviews <span class="count">7</span></button>
    <button data-nav="evidence">Evidence</button>
    <button data-nav="dd">Due diligence</button>
    <button data-nav="reports">Reports</button>
    <div class="foot">Halvern Medical<br>Simulated demo environment</div>
  </nav>

  <div class="main">
    <header class="top">
      <label class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2"/></svg><input id="q" placeholder="Search suppliers, documents, reviews" aria-label="Search"></label>
      <div class="user"><div><b>Dana Whitfield</b><small>VP, Global Supplier Quality &amp; Third-Party Risk</small></div><div class="avatar">DW</div></div>
    </header>
    <main class="page" id="view"></main>
  </div>
</div>

<script>
const TODAY = "Tue, Oct 20, 2026";
const suppliers = [
 {id:"bw",name:"Brightwater Sterilization",cat:"EtO sterilization",tier:"Critical",score:84,d:+7,src:"out",sig:"Supplier notification: capacity review at Marlow site",owner:"M. Ortiz",ev:"Today"},
 {id:"np",name:"Northpeak Cloud",cat:"App and data hosting",tier:"Critical",score:71,d:+19,src:"out",sig:"Published vulnerability in hosted platform component",owner:"InfoSec",ev:"Oct 19"},
 {id:"ks",name:"Kestrel Contract Manufacturing",cat:"Sensor assembly",tier:"Critical",score:68,d:+4,src:"in",sig:"Two corrective actions past due; 3 audit findings",owner:"Supplier Quality",ev:"Oct 14"},
 {id:"cv",name:"Corvane Semiconductor",cat:"BLE transmitter chip",tier:"Critical",score:63,d:+6,src:"out",sig:"Lead time extended from 16 to 26 weeks",owner:"M. Ortiz",ev:"Oct 16"},
 {id:"am",name:"Aldermoor Adhesives",cat:"Skin adhesive patch",tier:"High",score:58,d:+11,src:"in",sig:"Skin-irritation complaints above control limit",owner:"Supplier Quality",ev:"Oct 18"},
 {id:"x1",name:"Pellham Molded Components",cat:"Sensor housing",tier:"High",score:54,d:+9,src:"in",sig:"Questionnaire response 4x slower than prior year",owner:"J. Reyes",ev:"Oct 12"},
 {id:"x2",name:"Oakline Labels & Packaging",cat:"Sterile barrier packaging",tier:"High",score:51,d:+5,src:"in",sig:"ISO 13485 certificate expires in 34 days",owner:"J. Reyes",ev:"Oct 09"},
 {id:"x3",name:"Varden Logistics",cat:"Cold-chain distribution",tier:"High",score:49,d:+8,src:"out",sig:"Credit rating downgrade",owner:"Procurement",ev:"Oct 15"},
 {id:"x4",name:"Seliq Biocompatibility Labs",cat:"Testing services",tier:"High",score:47,d:+3,src:"in",sig:"Report turnaround slipping three months running",owner:"Supplier Quality",ev:"Oct 07"},
 {id:"x5",name:"Harrow Precision Tooling",cat:"Injection molds",tier:"Medium",score:46,d:+12,src:"out",sig:"Ownership change filed",owner:"Procurement",ev:"Oct 17"},
 {id:"x6",name:"Quintel Battery Systems",cat:"Transmitter battery",tier:"High",score:45,d:+4,src:"in",sig:"Attestation conflicts with prior audit note",owner:"M. Ortiz",ev:"Oct 11"},
 {id:"x7",name:"Brisa Electronica",cat:"PCB assembly (MX)",tier:"High",score:43,d:+6,src:"out",sig:"Regional customs delays reported",owner:"Procurement",ev:"Oct 13"},
 {id:"x8",name:"Calder Clinical Research",cat:"Post-market studies",tier:"High",score:41,d:+3,src:"in",sig:"Data processing agreement past renewal",owner:"Privacy",ev:"Oct 08"},
 {id:"x9",name:"Fennick Medical Gases",cat:"Facility gases",tier:"Medium",score:39,d:+7,src:"out",sig:"Environmental permit renewal pending",owner:"J. Reyes",ev:"Oct 10"},
 {id:"x10",name:"Tamsin Software",cat:"Firmware tooling",tier:"Medium",score:37,d:+5,src:"out",sig:"End-of-support notice for licensed component",owner:"InfoSec",ev:"Oct 06"},
 {id:"x11",name:"Ardent Translation Services",cat:"Labeling translation",tier:"Medium",score:35,d:+4,src:"in",sig:"Two labeling errors in last 90 days",owner:"Regulatory",ev:"Oct 05"},
 {id:"x12",name:"Morrow Field Services",cat:"Clinic training",tier:"Medium",score:33,d:+6,src:"in",sig:"Insurance certificate lapsed",owner:"Procurement",ev:"Oct 03"},
 {id:"x13",name:"Lumen Print Works",cat:"Instructions for use",tier:"Low",score:31,d:+8,src:"in",sig:"Missed two delivery windows",owner:"Procurement",ev:"Oct 02"},
 {id:"x14",name:"Grayford Staffing",cat:"Contract labor",tier:"Medium",score:29,d:+4,src:"out",sig:"Labor dispute reported in local press",owner:"HR",ev:"Sep 30"},
 {id:"x15",name:"Delmont Waste Services",cat:"Regulated waste",tier:"Medium",score:27,d:+3,src:"out",sig:"State inspection notice posted",owner:"EHS",ev:"Sep 29"}
];
const tierPill = t => ({Critical:"p-crit",High:"p-warn",Medium:"p-neu",Low:"p-neu"}[t]);
const scoreColor = s => s>=60?"var(--crit)":s>=45?"var(--warn)":"var(--ok)";
const view = document.getElementById("view");
let filter = "all";

function nav(k){
  document.querySelectorAll(".rail button").forEach(b=>b.classList.toggle("on",b.dataset.nav===k));
  if(k==="watch") return watchList();
  if(k==="reviews") return reviewsList();
  if(k==="dd") return ddList();
  view.innerHTML = `<div class="panel fade"><div class="empty">This area isn't part of today's walkthrough.<br><button class="btn ghost" style="margin-top:12px" onclick="nav('watch')">Back to watch list</button></div></div>`;
}
document.querySelectorAll(".rail button").forEach(b=>b.onclick=()=>nav(b.dataset.nav));

function watchList(){
  const rows = suppliers.filter(s=>filter==="all"||(filter==="crit"&&s.tier==="Critical")||(filter==="in"&&s.src==="in")||(filter==="out"&&s.src==="out"));
  view.innerHTML = `
  <div class="fade" style="display:flex;flex-direction:column;gap:18px">
   <div><h1>Watch list</h1><div class="sub">Week of Oct 19, 2026 · Suppliers whose early warning score moved, ranked by attention needed</div></div>
   <div class="kpis">
     <div class="kpi"><b class="num">20</b><span>On this week's list, of 1,412</span></div>
     <div class="kpi"><b class="num" style="color:var(--crit)">4</b><span>Above watch line (60)</span></div>
     <div class="kpi"><b class="num">7</b><span>Reviews open</span></div>
     <div class="kpi"><b class="num">1,392</b><span>On baseline monitoring</span></div>
   </div>
   <div class="panel">
    <div class="panel-h"><h2>Score movers</h2>
     <div class="row" style="margin-left:auto;gap:6px">
      ${[["all","All"],["crit","Critical tier"],["in","Internal signals"],["out","External signals"]].map(([k,l])=>`<button class="chip ${filter===k?"on":""}" data-f="${k}">${l}</button>`).join("")}
     </div></div>
    <div class="tablewrap"><table>
     <thead><tr><th>Supplier</th><th>Tier</th><th>Score</th><th>7-day</th><th>Top signal</th><th>Owner</th><th>Latest evidence</th></tr></thead>
     <tbody>${rows.map(s=>`<tr tabindex="0" data-id="${s.id}">
       <td><b>${s.name}</b><div class="sig">${s.cat}</div></td>
       <td><span class="pill ${tierPill(s.tier)}">${s.tier}</span></td>
       <td><span class="score"><span class="num">${s.score}</span><span class="bar"><i style="width:${s.score}%;background:${scoreColor(s.score)}"></i></span></span></td>
       <td class="num up">▲ ${s.d}</td>
       <td class="sig"><span class="src ${s.src}">${s.src==="in"?"Internal":"External"}</span>${s.sig}</td>
       <td>${s.owner}</td><td class="num">${s.ev}</td></tr>`).join("")}</tbody>
    </table></div>
   </div>
   <div class="demo-flag">Ranking, not a verdict. Every flag routes to a documented review. Halvern Medical and all suppliers are fictional.</div>
  </div>`;
  view.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;watchList()});
  view.querySelectorAll("tbody tr").forEach(r=>{
    const go=()=>{ if(r.dataset.id==="bw") record("history"); };
    r.onclick=go; r.onkeydown=e=>{if(e.key==="Enter")go()};
  });
}

/* Brightwater score history: weekly points */
const hist = [["Aug 18",16],["Aug 25",17],["Sep 1",34],["Sep 8",63],["Sep 15",64],["Sep 22",65],["Sep 29",76],["Oct 6",77],["Oct 13",77],["Oct 20",84]];
const events = [
 {i:2,n:1,label:"Questionnaire returned 52 days after request"},
 {i:3,n:2,label:"Attestation conflicts with public state notice"},
 {i:6,n:3,label:"Corrective action response repeats 2024 language"},
 {i:9,n:4,label:"Supplier notification received today"}
];
let sel = 2;

function record(tab){
  view.innerHTML = `
  <div class="fade" style="display:flex;flex-direction:column;gap:16px">
   <div class="crumbs"><a onclick="nav('watch')">Watch list</a> › Brightwater Sterilization</div>
   <div class="row" style="justify-content:space-between">
     <div><h1>Brightwater Sterilization</h1><div class="sub">Ethylene oxide sterilization · Steadia CGM sensors · Supplier ID HM-S-00218</div></div>
     <div class="row"><span class="pill p-crit">Critical tier</span><span class="pill p-warn">Single-source</span>
       <span class="score" style="font-size:13px">Early warning <b class="num" style="font-size:20px;color:var(--crit)">84</b></span></div>
   </div>
   <div class="tabs" role="tablist">
     ${[["overview","Overview"],["history","Risk history"],["evidence","Evidence (148)"],["issues","Issues (2)"],["alts","Alternates"]].map(([k,l])=>`<button role="tab" aria-selected="${k===tab}" class="${k===tab?"on":""}" data-t="${k}">${l}</button>`).join("")}
   </div>
   <div id="tabbody"></div>
  </div>`;
  view.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>record(b.dataset.t));
  const tb = document.getElementById("tabbody");
  if(tab==="history") historyTab(tb);
  else if(tab==="overview") overviewTab(tb);
  else if(tab==="alts") altsTab(tb);
  else tb.innerHTML = `<div class="panel"><div class="empty">Not part of today's walkthrough.</div></div>`;
}

function overviewTab(tb){
  tb.innerHTML = `<div class="grid2">
   <div class="panel"><div class="panel-h"><h2>Supplier profile</h2></div>
    <dl class="facts">
     <dt>Service</dt><dd>EtO sterilization of all Steadia sensor lots</dd>
     <dt>Sites</dt><dd>Marlow (primary, ~80% of volume) · Ashby (validated)</dd>
     <dt>Tier set</dt><dd>Onboarding, Jun 2023 · re-tier recommended</dd>
     <dt>Quality agreement</dt><dd>QA-0218, rev C, effective Mar 2025</dd>
     <dt>Last on-site audit</dt><dd>Apr 2025 · 2 minor findings, closed</dd>
     <dt>Relationship owner</dt><dd>Supplier Quality · Maya Ortiz (TPRM)</dd>
    </dl></div>
   <div class="panel"><div class="panel-h"><h2>Open items</h2></div>
    <dl class="facts">
     <dt>Corrective actions</dt><dd>SCAR-2291 · documentation · response under review</dd>
     <dt>Early warning review</dt><dd>Not started</dd>
     <dt>Backup sterilizer</dt><dd><span class="pill p-crit">Conflict</span> 3 systems list 3 different backups</dd>
    </dl></div>
  </div>`;
}

function altsTab(tb){
  tb.innerHTML = `<div class="panel"><div class="panel-h"><h2>Sterilization alternates</h2><span class="sub">Reconciled across Procurement, Quality and ERP vendor master</span></div>
   <div class="tablewrap"><table class="alts"><thead><tr><th>Alternate</th><th>Listed in</th><th>Validated for Steadia</th><th>Capacity</th><th>Status</th></tr></thead><tbody>
    <tr><td><b>Brightwater · Ashby site</b></td><td>Quality</td><td>Yes · Jan 2024</td><td class="num">~92% utilized</td><td><span class="pill p-warn">Near capacity</span></td></tr>
    <tr><td><b>Kelso Sterile Services</b></td><td>Procurement</td><td>No validation on file</td><td>Unknown</td><td><span class="pill p-crit">Not qualified</span></td></tr>
    <tr><td><b>Ridgeway Medical Sterilization</b></td><td>ERP vendor master</td><td>Expired 2022 · E-beam, not EtO</td><td>n/a</td><td><span class="pill p-crit">Not a valid alternate</span></td></tr>
   </tbody></table></div></div>`;
}

function historyTab(tb){
  tb.innerHTML = `<div class="grid2">
    <div class="panel"><div class="panel-h"><h2>Early warning score, last 9 weeks</h2><span class="sub">Watch line at 60 · click a marker to see the evidence</span></div>
      <div class="chart" id="chart"></div></div>
    <div class="panel" id="evpanel"></div>
  </div>`;
  drawChart(); evidence();
}

function drawChart(){
  const W=640,H=300,L=40,R=16,T=18,B=40, x=i=>L+i*(W-L-R)/(hist.length-1), y=v=>T+(100-v)*(H-T-B)/100;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Brightwater early warning score rising from 16 to 84 between Aug 18 and Oct 20, crossing the watch line on Sep 8">`;
  [0,20,40,60,80,100].forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v}</text>`});
  s+=`<rect x="${L}" y="${y(100)}" width="${W-L-R}" height="${y(60)-y(100)}" fill="var(--crit-soft)" opacity=".55"/>`;
  s+=`<line x1="${L}" x2="${W-R}" y1="${y(60)}" y2="${y(60)}" stroke="var(--crit)" stroke-dasharray="4 4"/><text x="${W-R}" y="${y(60)-6}" text-anchor="end" font-size="11" fill="var(--crit)">Watch line</text>`;
  hist.forEach((h,i)=>{ if(i%1===0) s+=`<text x="${x(i)}" y="${H-14}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${h[0]}</text>`});
  const pts=hist.map((h,i)=>`${x(i)},${y(h[1])}`).join(" ");
  s+=`<polygon points="${x(0)},${y(0)} ${pts} ${x(hist.length-1)},${y(0)}" fill="var(--accent)" opacity=".08"/>`;
  s+=`<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
  s+=`<line x1="${x(3)}" x2="${x(3)}" y1="${y(100)}" y2="${y(0)}" stroke="var(--fg)" stroke-width="1" opacity=".35"/><text x="${x(3)+6}" y="${y(96)}" font-size="11" fill="var(--fg)">Crossed watch line · Sep 8</text>`;
  hist.forEach((h,i)=>{ if(!events.find(e=>e.i===i)) s+=`<circle cx="${x(i)}" cy="${y(h[1])}" r="3" fill="var(--accent)"/>`});
  events.forEach(e=>{ const on=e.i===sel;
    s+=`<g class="marker" tabindex="0" data-i="${e.i}" aria-label="Signal ${e.n}: ${e.label}"><circle cx="${x(e.i)}" cy="${y(hist[e.i][1])}" r="${on?12:10}" fill="${on?"var(--crit)":"var(--surface)"}" stroke="var(--crit)" stroke-width="2"/><text x="${x(e.i)}" y="${y(hist[e.i][1])+4}" text-anchor="middle" font-size="11" font-weight="700" fill="${on?"#fff":"var(--crit)"}">${e.n}</text></g>`});
  s+=`</svg>`;
  const c=document.getElementById("chart"); c.innerHTML=s;
  c.querySelectorAll(".marker").forEach(m=>{const go=()=>{sel=+m.dataset.i;drawChart();evidence()}; m.onclick=go; m.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}}});
}

function evidence(){

    <div class="lat">
      <div><span>2023 cycle</span><i style="width:12%"></i><span class="num">6 days</span></div>
      <div><span>2024 cycle</span><i style="width:16%"></i><span class="num">8 days</span></div>
      <div><span>2025 cycle</span><i style="width:10%"></i><span class="num">5 days</span></div>
      <div><span><b>2026 cycle</b></span><i class="hot" style="width:100%"></i><span class="num"><b>52 days</b></span></div>
    </div>
    <div class="sub">On its own, a slow response is weak evidence. Weighted low; supplier moved to watch status.</div>
    <div class="doc"><div class="meta">Analyst note · M. Ortiz · Aug 29</div>"Brightwater late this year - follow up re: reason."</div></div>`;
  if(sel===3) h=`<div class="panel-h"><h2>Signal 2 · Attestation mismatch</h2><span class="pill p-crit">High weight</span></div><div class="ev fade">
    <div class="callout">What the supplier attested and what the public record shows don't match.</div>
    <div class="docs">
     <div class="doc"><div class="meta">Questionnaire · Q14 · submitted Aug 28</div>Are there any open regulatory actions, notices, or reviews at any facility that processes Halvern product?<br><br><b>Supplier answer:</b> <mark>No open regulatory actions at any facility.</mark></div>
     <div class="doc"><div class="meta">State environmental quality board · posted Aug 7</div>Notice of compliance review: Brightwater Sterilization, <mark>Marlow facility</mark>. Review of ethylene oxide emissions controls; <mark>status: open</mark>.</div>
    </div>
    <div class="sub">Matched automatically on Sep 4 · contributed most of the jump past the watch line on Sep 8.</div></div>`;
  if(sel===6) h=`<div class="panel-h"><h2>Signal 3 · Recycled corrective action</h2><span class="pill p-warn">Medium weight</span></div><div class="ev fade">
    <div class="docs">
     <div class="doc"><div class="meta">SCAR-1874 response · Mar 2024</div>Root cause: <mark>operator did not follow the batch record review step due to insufficient training on revised procedure</mark>. Corrective action: <mark>retrain all operators and add a second-person verification</mark>.</div>
     <div class="doc"><div class="meta">SCAR-2291 response · Sep 26, 2026</div>Root cause: <mark>operator did not follow the batch record review step due to insufficient training on revised procedure</mark>. Corrective action: <mark>retrain all operators and add a second-person verification</mark>.</div>
    </div>
    <div class="sub">Text similarity 91% · same root cause and fix as a closed 2024 action suggests the original fix did not hold.</div></div>`;
  if(sel===9) h=`<div class="panel-h"><h2>Signal 4 · Supplier notification</h2><span class="pill p-crit">Confirmed</span></div><div class="ev fade">
    <div class="doc"><div class="meta">Email from Brightwater · Oct 20, 7:40 AM</div>Marlow site under state environmental review. Capacity may be reduced. No timeline confirmed.</div>
    <div class="callout">Brightwater crossed the watch line on Sep 8, six weeks before this notification.</div>
    <div class="row"><button class="btn" onclick="record('alts')">Check alternates</button><button class="btn ghost" onclick="openReview()">Start review</button></div></div>`;
  p.innerHTML=h;
}

function review(){

  [0,5,10,15,20,25,30].forEach(w=>{s+=`<line x1="${x(w)}" x2="${x(w)}" y1="10" y2="${H-26}" stroke="var(--line)"/><text x="${x(w)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${w}w</text>`});
  s+=`<rect x="${x(8)}" y="10" width="${x(26)-x(8)}" height="${H-36}" fill="var(--crit-soft)" opacity=".7"/><text x="${(x(8)+x(26))/2}" y="${H-32}" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--crit)">Exposure gap if Marlow stays down</text>`;
  bars.forEach((b,i)=>{const y=20+i*38;s+=`<text x="${L-10}" y="${y+14}" text-anchor="end" font-size="12" fill="var(--fg)">${b[0]}</text><rect x="${x(b[1])}" y="${y}" width="${x(b[2])-x(b[1])}" height="20" rx="3" fill="${b[3]}" ${i===2?'opacity=".45"':''}/><text x="${x(b[2])+6}" y="${y+14}" font-size="11" fill="var(--muted)">${b[4]}</text>`});
  s+=`</svg>`;
  view.innerHTML=`<div class="fade" style="display:flex;flex-direction:column;gap:16px">
   <div class="crumbs"><a onclick="nav('reviews')">Reviews</a> › RV-0412</div>
   <div class="row" style="justify-content:space-between"><div><h1>Brightwater Sterilization · Early warning review</h1><div class="sub">RV-0412 · Opened Oct 20, 9:22 AM · Owner Dana Whitfield · Linked signals 4</div></div>
    <span class="pill ${decided?"p-ok":"p-warn"}" id="rvstatus">${decided?"Decision recorded 4:48 PM":"In review"}</span></div>
   <div class="panel"><div class="panel-h"><h2>Exposure window</h2><span class="sub">Supply chain update 1:15 PM · weeks from today</span></div><div class="chart">${s}</div></div>

   <div class="grid2">
    <div class="panel"><div class="panel-h"><h2>Actions</h2></div><div class="tablewrap"><table class="alts"><thead><tr><th>Action</th><th>Owner</th><th>Due</th></tr></thead><tbody>
      <tr><td>Secure priority capacity at Brightwater Ashby</td><td>D. Whitfield</td><td class="num">Oct 22</td></tr>
      <tr><td>Start qualification of a second EtO sterilizer</td><td>Supplier Quality</td><td class="num">Oct 30</td></tr>
      <tr><td>Remove unqualified backups from Procurement and ERP lists</td><td>M. Ortiz</td><td class="num">Oct 23</td></tr>
      <tr><td>Request corrected attestation and site status from Brightwater</td><td>M. Ortiz</td><td class="num">Oct 21</td></tr>
      <tr><td>Brief COO on exposure window and plan</td><td>D. Whitfield</td><td class="num">Today 5 PM</td></tr>
    </tbody></table></div></div>
    <div class="panel"><div class="panel-h"><h2>Decision</h2></div><div class="ev">
      <dl class="facts" style="padding:0"><dt>Disposition</dt><dd>Escalated · active supply risk</dd><dt>Basis</dt><dd>Signals 1-4, alternates reconciliation, inventory position</dd><dt>Re-tier</dt><dd>Critical · single-source confirmed</dd></dl>
      <div class="doc"><div class="meta">Summary for COO</div>About 6 weeks of sterilized sensors on hand, plus roughly 2 weeks the Ashby site can absorb. A new sterilizer takes 20-26 weeks to validate. If Marlow is down more than ~8 weeks, we have a gap: about $32M a month of Steadia supply runs through Marlow, so roughly $7-8M of revenue at risk per week beyond cover, more than $100M worst case. Plan: priority capacity at Ashby now, second sterilizer qualification starts this month.</div>
